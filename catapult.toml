# Release configuration consumed by ./catapult.
# Schema: catapult/catapult.toml.example

[app]
name        = "Mamecase"
slug        = "mamecase"
bundle_id   = "me.douglaslassance.mamecase"
team_id     = "556XHQJK3G"
developer   = "Douglas Lassance"
homepage    = "https://douglaslassance.me/mamecase"
description = "MAME front-end"
category    = "public.app-category.entertainment"
min_macos   = "14.0"

[build]
kind          = "swift"
arch          = "arm64"
target_triple = "aarch64-apple-darwin"
swift_target  = "Mamecase"
icon_command  = "./build_icons.sh"

[sparkle]
feed_url = "https://s3.douglaslassance.me/mamecase/mamecase.xml"

[s3]
bucket_prefix         = "mamecase"
appcast_filename      = "mamecase.xml"
download_url_template = "https://api.douglaslassance.me/mamecase/download/{version}/{target}"

[homebrew]
cask_name = "mamecase"

[plist.extras]
# Points macOS 26 at the adaptive icon in build/Assets.car, which carries the
# light, dark and tinted renditions. Older macOS ignores it and uses
# AppIcon.icns.
CFBundleIconName = "AppIcon"
